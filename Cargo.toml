[package]
name = "pc-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
directories = "6.0.0"
egui = { version = "0.37.0", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
if-addrs = "0.15.0"
log = "0.4.35"
pollster = "1.0.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screencast"] }
evdev = "0.13.2"
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_WiFi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console"] }

[profile.release]
lto = "thin"
strip = true
